server:
  port: 8082
  # railgate refuses to start without TLS on this listener (ListenerTlsGuard):
  # configure server.ssl.bundle (or server.ssl.key-store / certificate), and
  # for mTLS server.ssl.client-auth=need with a trust store. The dev profile
  # overrides the guard for a local run.
  # Headers only; the JSON body is bounded by railgate.limits below.
  max-http-request-header-size: 8KB
  tomcat:
    # railgate accepts no form-encoded bodies.
    max-http-form-post-size: 16KB
    # How much of a rejected body Tomcat reads and discards before closing.
    max-swallow-size: 64KB

spring:
  application:
    name: railgate

# OpenAPI document and Swagger UI are off in every non-dev profile. Neither has
# a run-time function in this service, and the UI is a third-party JavaScript
# application (swagger-ui, DOMPurify) whose vulnerabilities would otherwise be
# part of the deployed surface. Enable locally with --spring.profiles.active=dev
# (application-dev.yml).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

railgate:
  limits:
    # Maximum request body, enforced by RequestSizeLimitFilter. A settlement
    # request is well under 1 KB.
    max-http-request-size: 16KB

  server:
    # Escape hatch for a local development run without TLS on railgate's own
    # listener. Never set it in a deployed configuration.
    allow-insecure-http: false

  payment-network:
    # In production, replace with an HTTP-based client that calls Getswish AB's
    # signature-retrieval endpoint. The in-memory mode is for the reference
    # implementation demonstration flow and integration tests.
    mode: in-memory

  gatekeeper:
    # Base URL of the supervisor's gatekeeper instance. railgate calls
    # POST {base-url}/api/v1/verify with {certSerial, issuerDn, digestHex,
    # signatureBase64} to verify each settlement.
    #
    # https is required. Over plain HTTP the verification verdict is neither
    # confidential nor integrity-protected: railgate does not verify a
    # signature over the gatekeeper's response, so an intermediary can rewrite
    # signatureValid and compliant to true and the settlement proceeds. The
    # port is the conventional 8443; the gatekeeper's own TLS listener is
    # configured on its side (server.ssl.* in gatekeeper's application.yaml)
    # or terminated by a reverse proxy in front of it.
    base-url: https://localhost:8443

    # Escape hatch for a local development run against a gatekeeper started
    # without TLS. Leaving this at false makes an http:// base-url a start-up
    # failure rather than a silent downgrade. Setting it to true logs a WARN
    # at every start-up. Never set it in a deployed configuration.
    allow-insecure-http: false

    # Bounded waits. A settlement rail must receive a deny rather than block on
    # an unresponsive gatekeeper. ISO-8601 durations.
    connect-timeout: PT2S
    read-timeout: PT5S

  regulated:
    # Local-instrument codes that identify regulated payments subject to
    # railgate enforcement. "SWISH" is a placeholder: the code must be one
    # that only Swish utbetalning carries, and the values Swish uses are not
    # published in Anvisningar RIX-INST.
    local-instrument-codes: SWISH

logging:
  level:
    eu.gillstrom.railgate: INFO
