server:
  port: 8082
  # railgate refuses to start without TLS on this listener (ListenerTlsGuard):
  # configure server.ssl.bundle (or server.ssl.key-store / certificate), and
  # for mTLS server.ssl.client-auth=need with a trust store. The dev profile
  # overrides the guard for a local run.
  # Headers only; the JSON body is bounded by railgate.limits below.
  max-http-request-header-size: 8KB
  tomcat:
    # railgate accepts no form-encoded bodies.
    max-http-form-post-size: 16KB
    # How much of a rejected body Tomcat reads and discards before closing.
    max-swallow-size: 64KB

spring:
  application:
    name: railgate
  web:
    resources:
      # railgate serves an API and no static files. Left at its default, Spring
      # Boot maps /webjars/** to every WebJar on the class path, and the
      # swagger-ui package that springdoc depends on was served there in every
      # profile, whatever springdoc.swagger-ui.enabled says. In the dev profile
      # springdoc serves the UI through its own handler.
      add-mappings: false

# OpenAPI document and Swagger UI are off in every non-dev profile. Neither has
# a run-time function in this service, and the UI is a third-party JavaScript
# application (swagger-ui, DOMPurify) whose vulnerabilities would otherwise be
# part of the deployed surface. Enable locally with --spring.profiles.active=dev
# (application-dev.yml).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

railgate:
  limits:
    # Maximum request body, enforced by RequestSizeLimitFilter. A settlement
    # request is well under 1 KB.
    max-http-request-size: 16KB

  server:
    # Escape hatch for a local development run without TLS on railgate's own
    # listener. Never set it in a deployed configuration.
    allow-insecure-http: false

  payment-network:
    # in-memory (default): reference demonstration flow and tests.
    # file: local end-to-end runs; requires railgate.payment-network.file.
    # http: HttpPaymentNetworkClient against the operator interface specified in
    #   api/payment-network-operator.openapi.yaml (no operator offers it today).
    #   Every 200 answer must carry an op1 signature that verifies under a
    #   certificate in trusted-keys, or the settlement is denied with
    #   OPERATOR_SIGNATURE_INVALID. Requires base-url and trusted-keys.
    mode: in-memory

    # http mode only. The operator's base URL; GET {base-url}/v1/payout-artefacts/{ref}.
    # Must be https:// unless allow-insecure-http is true.
    # base-url: https://payment-network-operator.example
    # Local development only: permits an http:// base-url and logs a WARN at start-up.
    allow-insecure-http: false
    # Name of a Spring Boot SSL bundle (spring.ssl.bundle.*) holding the client
    # certificate for mTLS and the truststore for the operator. Empty: JVM defaults.
    # ssl-bundle: payment-network
    # connect-timeout bounds the connect; read-timeout bounds the whole exchange
    # after it, up to the last byte of the answer. Both greater than zero.
    connect-timeout: PT2S
    read-timeout: PT5S
    # PEM file (classpath:, file: or a plain path) with the operator's signing
    # certificate(s); operatorKeyFingerprintHex selects one by the SHA-256 of its
    # DER SubjectPublicKeyInfo (lowercase hex, the gatekeeper /keys convention).
    # trusted-keys: /etc/railgate/payment-network-operator.pem

  gatekeeper:
    # Base URL of the supervisor's gatekeeper instance. railgate calls
    # POST {base-url}/api/v1/verify with {certSerial, issuerDn, digestHex,
    # signatureBase64} to verify each settlement.
    #
    # https is required. Over plain HTTP the request and the verdict are
    # readable by any intermediary; without a signed verdict (below) they are
    # also rewritable, and an intermediary could set signatureValid and
    # compliant to true. The port is the conventional 8443; the gatekeeper's
    # own TLS listener is configured on its side (server.ssl.* in gatekeeper's
    # application.yaml) or terminated by a reverse proxy in front of it.
    base-url: https://localhost:8443

    # Escape hatch for a local development run against a gatekeeper started
    # without TLS. Leaving this at false makes an http:// base-url a start-up
    # failure rather than a silent downgrade. Setting it to true logs a WARN
    # at every start-up. Never set it in a deployed configuration.
    allow-insecure-http: false

    # Bounded waits. A settlement rail must receive a deny rather than block on
    # an unresponsive gatekeeper. ISO-8601 durations, each greater than zero.
    # connect-timeout bounds the connect; read-timeout bounds everything after
    # it, up to the last byte of the answer, so that an answer arriving a byte
    # at a time ends in a NETWORK_ERROR deny as well.
    connect-timeout: PT2S
    read-timeout: PT5S

    # Signed verdicts. With require-signed-verdict true, a verdict is used only if
    # it carries the gatekeeper's sv1 signature under a certificate in
    # trusted-keys, over the request railgate sent, with verifiedAt within
    # verdict-max-skew of railgate's clock; otherwise the settlement is denied
    # with VERDICT_SIGNATURE_INVALID or VERDICT_STALE. If trusted-keys is empty
    # while a signature is required, railgate starts, logs a WARN, and denies
    # every settlement that reaches the gatekeeper. With require-signed-verdict
    # false (the dev profile), unsigned verdicts are accepted and recorded as
    # UNSIGNED; signed ones are verified if trusted-keys is set, and otherwise
    # accepted unchecked as UNVERIFIED.
    # trusted-keys: /etc/railgate/gatekeeper-signing.pem
    require-signed-verdict: true
    verdict-max-skew: PT60S

  replay:
    # Append-only journal of the transaction references (and operator payout
    # instruction ids) railgate has allowed, fsynced per record and replayed at
    # start-up. A settlement carrying either again is denied with
    # REFERENCE_ALREADY_SETTLED. Unset: held in memory and lost on restart.
    # path: /var/lib/railgate/replay.journal

  regulated:
    # Local-instrument codes that identify regulated payments subject to
    # railgate enforcement. "SWISH" is a placeholder: the code must be one
    # that only Swish utbetalning carries, and the values Swish uses are not
    # published in Anvisningar RIX-INST.
    local-instrument-codes: SWISH

logging:
  level:
    eu.gillstrom.railgate: INFO
