## Developer profile — activate with: --spring.profiles.active=dev
##
## This profile turns the OpenAPI document and Swagger UI back on, lets
## railgate start without TLS on its own listener, and accepts unsigned
## gatekeeper verdicts. Every other profile leaves all three off (see
## application.yml). Do not deploy with this profile active.

railgate:
  server:
    allow-insecure-http: true
  gatekeeper:
    # Accept gatekeeper verdicts without a verified signature, recorded as
    # UNSIGNED (no signature fields) or UNVERIFIED (signature fields present but
    # no railgate.gatekeeper.trusted-keys configured to check them with). If
    # trusted-keys is configured, a signed verdict is still verified.
    require-signed-verdict: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # The swagger-ui WebJar that pom.xml pins (org.webjars:swagger-ui). springdoc
    # serves /swagger-ui/** from the WebJar directory of the version it was
    # built with, 5.34.0 for springdoc 3.2.0; with the WebJar pinned to another
    # version and this left unset, /swagger-ui.html redirected to a 404.
    # OpenApiExposureDevProfileTest fails when the two versions differ.
    version: 5.34.1
