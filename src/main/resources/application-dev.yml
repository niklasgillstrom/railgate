## Developer profile — activate with: --spring.profiles.active=dev
##
## This profile turns the OpenAPI document and Swagger UI back on, and lets
## railgate start without TLS on its own listener. Every other profile leaves
## both off (see application.yml). Do not deploy with this profile active.

railgate:
  server:
    allow-insecure-http: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
